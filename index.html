<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tic Tac Toe</title>
    <link rel="icon" href="./image/image.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <button id="new-btn">Play Again</button>
    </div>
    
    <main>
        <h1>Tic Tac Toe</h1>
        
        <div class="scoreboard">
            <div class="score-card player-x">
                <span class="player-label">Player X</span>
                <span class="score-value" id="score-x">0</span>
            </div>
            <div class="score-card draw">
                <span class="player-label">Draws</span>
                <span class="score-value" id="score-draw">0</span>
            </div>
            <div class="score-card player-o">
                <span class="player-label">Player O</span>
                <span class="score-value" id="score-o">0</span>
            </div>
        </div>

        <div class="container">
            <div class="game">
                <button class="box" data-index="0"></button>
                <button class="box" data-index="1"></button>
                <button class="box" data-index="2"></button>
                <button class="box" data-index="3"></button>
                <button class="box" data-index="4"></button>
                <button class="box" data-index="5"></button>
                <button class="box" data-index="6"></button>
                <button class="box" data-index="7"></button>
                <button class="box" data-index="8"></button>
            </div>
        </div>
        
        <button id="reset-btn">Reset Scores</button>
    </main>

    <script src="index.js"></script>
</body>
</html>
